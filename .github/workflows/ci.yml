name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: macOS build and tests
    # Liquid Glass APIs require the macOS 26 SDK even though their use is
    # availability-gated for the app's macOS 13 deployment target.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify immutable dependency declarations
        run: ./Scripts/verify-dependency-lock.sh

      - name: Resolve dependencies from the checked-in lockfile
        run: |
          xcodebuild -project Silocleaner.xcodeproj -resolvePackageDependencies
          git diff --exit-code -- Silocleaner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Execute helper security and core safety tests
        run: swift test --disable-sandbox

      - name: Build Debug without local signing configuration
        run: |
          xcodebuild -project Silocleaner.xcodeproj \
            -scheme 'Silocleaner Debug' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/silocleaner-debug" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build Release without local signing configuration
        run: |
          xcodebuild -project Silocleaner.xcodeproj \
            -scheme 'Silocleaner Release' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/silocleaner-release" \
            CODE_SIGNING_ALLOWED=NO build
